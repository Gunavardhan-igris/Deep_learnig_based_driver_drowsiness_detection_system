{% extends 'base.html' %} {% load static %} {% block contents %}

<style>
  .forgot-page {
    min-height: calc(100vh - 72px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #eef2ff, #dbeafe);
  }

  .forgot-card {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
  }

  .forgot-header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white;
    text-align: center;
    padding: 35px;
  }

  .forgot-header h2 {
    margin-top: 10px;
    font-weight: 700;
  }

  .forgot-header p {
    color: rgba(255, 255, 255, 0.8);
  }

  .forgot-body {
    padding: 35px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .form-control {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    outline: none;
    transition: 0.3s;
  }

  .form-control:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .btn-reset {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn-reset:hover {
    background: #1d4ed8;
  }

  .alert {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  .success {
    background: #dcfce7;
    color: #166534;
  }

  .error {
    background: #fee2e2;
    color: #991b1b;
  }

  .back-login {
    margin-top: 20px;
    text-align: center;
  }

  .back-login a {
    text-decoration: none;
    font-weight: 600;
    color: #2563eb;
  }
</style>

<div class="forgot-page">
  <div class="forgot-card">
    <div class="forgot-header">
      <h2>Forgot Password</h2>

      <p>Reset your Driver account password</p>
    </div>

    <div class="forgot-body">
      <form method="POST">
        {% csrf_token %} {% if messages %} {% for message in messages %}

        <div
          class="alert {% if 'success' in message.tags %}success{% else %}error{% endif %}"
        >
          {{message}}
        </div>

        {% endfor %} {% endif %}

        <div class="form-group">
          <label>Login ID</label>

          <input type="text" name="loginid" class="form-control" required />
        </div>

        <div class="form-group">
          <label>Registered Email</label>

          <input type="email" name="email" class="form-control" required />
        </div>

        <div class="form-group">
          <label>New Password</label>

          <input
            type="password"
            name="password"
            class="form-control"
            required
          />
        </div>

        <button class="btn-reset">Reset Password</button>

        <div class="back-login">
          <a href="{% url 'AutoistLogin' %}"> ← Back to Login </a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
