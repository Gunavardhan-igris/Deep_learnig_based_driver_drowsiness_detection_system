{% extends 'admins/adminbase.html' %} {% load static %} {% block contents %}

<style>
  .page {
    max-width: 700px;
    margin: 40px auto;
  }

  .profile-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
  }

  .profile-title {
    text-align: center;
    margin-bottom: 35px;
  }

  .profile-title h2 {
    font-size: 34px;
    font-weight: 700;
    color: #1e293b;
  }

  .profile-title p {
    color: #64748b;
    margin-top: 8px;
  }

  .form-group {
    margin-bottom: 25px;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #334155;
  }

  .form-control {
    width: 100%;
    height: 52px;
    border: 1px solid #dbeafe;
    border-radius: 10px;
    padding: 0 15px;
    font-size: 16px;
    transition: 0.3s;
  }

  .form-control:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 10px rgba(37, 99, 235, 0.15);
  }

  .btn-save {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: 600;
    transition: 0.3s;
  }

  .btn-save:hover {
    background: #1d4ed8;
  }

  .alert-success {
    background: #dcfce7;
    color: #166534;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
  }

  .alert-danger {
    background: #fee2e2;
    color: #991b1b;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
</style>

<div class="page">
  <div class="profile-card">
    <div class="profile-title">
      <h2>Owner Profile</h2>
      <p>Update your username and password</p>
    </div>

    {% if messages %} {% for message in messages %}
    <div
      class="alert-{% if message.tags == 'success' %}success{% else %}danger{% endif %}"
    >
      {{ message }}
    </div>
    {% endfor %} {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label>Username</label>

        <input
          type="text"
          name="username"
          class="form-control"
          value="{{ admin.username }}"
          required
        />
      </div>

      <div class="form-group">
        <label>New Password</label>

        <input type="password" name="password" class="form-control" required />
      </div>

      <div class="form-group">
        <label>Confirm Password</label>

        <input type="password" name="confirm" class="form-control" required />
      </div>

      <button class="btn-save">Update Profile</button>
    </form>
  </div>
</div>

{% endblock %}
