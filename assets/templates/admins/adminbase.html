{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Driver Drowsiness Monitoring</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      :root {
        --primary: #0d6efd;
        --dark-nav: #0f1c3a; /* Dark navy for navbar */
        --body-bg: #f0f2f5; /* Soft light gray-blue */
        --card-bg: #ffffff;
        --text-dark: #1e293b;
      }

      body {
        background-color: var(--body-bg);
        color: var(--text-dark);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
      }

      .navbar {
        background: var(--dark-nav) !important;
        box-shadow: 0 4px px rgba(0, 0, 0, 0.25);
        padding: 1rem 1rem;
      }

      .navbar-brand {
        font-weight: 700;
        font-size: 1.5rem;
        color: white !important;
        letter-spacing: -0.5px;
      }

      .nav-link {
        color: rgba(255, 255, 255, 0.85) !important;
        font-weight: 500;
        padding: 0.6rem 1.1rem !important;
        transition: all 0.25s ease;
      }

      .nav-link:hover {
        color: white !important;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 6px;
      }

      .nav-link.active {
        color: white !important;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 6px;
      }

      .logout-link {
        color: #ff6b6b !important;
      }

      .logout-link:hover {
        color: #ff8787 !important;
        background: rgba(255, 107, 107, 0.15) !important;
      }

      main {
        padding-top: 90px; /* space for fixed navbar */
        padding-bottom: 3rem;
      }

      .right_header_info h3 {
        color: #e74c3c;
        font-weight: 700;
        text-align: center;
        margin: 1.5rem 0 2.5rem;
        font-size: 1.8rem;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.08);
      }

      /* Optional card-like content wrapper */
      .content-wrapper {
        background: var(--card-bg);
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        padding: 2rem;
        margin-bottom: 2rem;
      }

      @media (max-width: 991px) {
        .navbar-nav {
          padding: 1rem 0;
        }
        .nav-link {
          padding: 0.8rem 1.5rem !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'AdminHome' %}">
          <i class="bi bi-shield-check-fill me-2"></i>Drowsiness Monitoring
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#adminNavbar"
          aria-controls="adminNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end"
          id="adminNavbar"
        >
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a
                class="nav-link {% if request.resolver_match.url_name == 'AdminHome' %}active{% endif %}"
                href="{% url 'AdminHome' %}"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.resolver_match.url_name == 'ViewRegisteredAutoists' %}active{% endif %}"
                href="{% url 'ViewRegisteredAutoists' %}"
                >View Autoist</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.resolver_match.url_name == 'AdminViewFatigueHistory' %}active{% endif %}"
                href="{% url 'AdminViewFatigueHistory' %}"
                >Fatigue</a
              >
            </li>
            <li>
              <a href="{% url 'OwnerProfile' %}"> Owner Profile </a>
            </li>
            <li class="nav-item ms-2 ms-lg-4">
              <a class="nav-link logout-link" href="{% url 'logout' %}">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
      <div class="right_header_info"></div>

      <!-- Optional: wrap your content blocks in this for nicer cards -->
      <div class="content-wrapper">{% block contents %} {% endblock %}</div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
